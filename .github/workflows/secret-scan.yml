# Vendored variant of Astera-org/github-workflows secret-scan.yml for the
# diff-use org (Free plan: cannot call the private reusable workflow).
# Synced manually; edit upstream first.
name: Secret scan

on:
  pull_request:
  # Commits can reach the default branch without a PR: the branch ruleset
  # grants PR-bypass to org admins, some repo roles, and integrations. Those
  # pushes were previously never scanned.
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# checks:write lets the scan jobs post a separate, NON-required check run with
# conclusion=failure when findings exist. That check shows red on the PR for
# visibility, but nothing requires it, so it never blocks merges. The workflow's
# own (required) check stays green unless ENFORCE_CREDENTIALS is on.
permissions:
  contents: read
  checks: write

env:
  GITLEAKS_VERSION: 8.30.1
  # Rollout switch: "false" = credential findings warn but do not
  # fail the check. Flip to "true" once the fleet-wide rollout is triaged.
  # Lives here (not a workflow_call input) because required-workflow rulesets
  # trigger this workflow directly, with no caller to pass inputs.
  ENFORCE_CREDENTIALS: "false"
  # Findings are announced here via chat.postMessage when the SECRET_SCAN_SLACK_BOT_TOKEN
  # secret is available (bot needs chat:write and to be in the channel).
  SLACK_CHANNEL_ID: C0BL6L7TS02

jobs:
  credentials:
    name: Credentials
    runs-on: ubuntu-latest
    env:
      HAVE_IGNORE_APP: ${{ secrets.SECRET_SCAN_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Resolve ignore-list repo
        id: ignore-repo
        if: ${{ vars.GITLEAKS_IGNORE_REPO != '' }}
        env:
          IGNORE_REPO: ${{ vars.GITLEAKS_IGNORE_REPO }}
        run: |
          # create-github-app-token throws when a repositories entry carries an
          # owner that differs from the resolved `owner` input, so the config
          # repo's owner must be passed explicitly. It is frequently a different
          # org than the repo being scanned.
          echo "owner=${IGNORE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${IGNORE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint token for the ignore-list repo
        id: ignore-auth
        # Fork PRs and callers that do not pass `secrets: inherit` have no App
        # credentials, so skip rather than fail the job; the scan then runs with
        # local ignores only, which errs toward reporting more, not less.
        if: ${{ vars.GITLEAKS_IGNORE_REPO != '' && env.HAVE_IGNORE_APP == 'true' && github.event.pull_request.head.repo.fork != true }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SECRET_SCAN_APP_ID }}
          private-key: ${{ secrets.SECRET_SCAN_APP_PRIVATE_KEY }}
          owner: ${{ steps.ignore-repo.outputs.owner }}
          repositories: ${{ steps.ignore-repo.outputs.name }}

      - name: Assemble gitleaks ignore list
        env:
          IGNORE_REPO: ${{ vars.GITLEAKS_IGNORE_REPO }}
          IGNORE_TOKEN: ${{ steps.ignore-auth.outputs.token }}
        run: |
          # Central entries plus any in-repo .gitleaksignore. Concatenating
          # matters because --gitleaks-ignore-path REPLACES the default lookup,
          # so pointing it elsewhere would silently disable a local file.
          mkdir -p /tmp/gitleaks-ignores
          : > /tmp/gitleaks-ignores/.gitleaksignore
          # A misconfiguration must be visible but must not turn the warn-only
          # check red fleet-wide; it only fails the job once findings block.
          fail_or_warn() {
            echo "::error title=$1::$2"
            if [ "$ENFORCE_CREDENTIALS" = "true" ]; then exit 1; fi
            echo "Continuing with local ignores only (warn-only rollout)."
          }
          if [ -n "$IGNORE_TOKEN" ]; then
            path="ignores/${GITHUB_REPOSITORY}.gitleaksignore"
            # Probe the repo first. The contents API answers 404 both for "no
            # ignore file for this repo" (fine) and for "repo missing or the App
            # cannot see it" (a misconfiguration GitHub deliberately hides as
            # 404), so the two are indistinguishable from the file call alone.
            # The repo name is deliberately not echoed: on a public repo these
            # logs are public and vars are not masked.
            if ! GH_TOKEN="$IGNORE_TOKEN" gh api "repos/${IGNORE_REPO}" --silent 2>/dev/null; then
              fail_or_warn "Ignore-list repo unreachable" "cannot read the repo named by GITLEAKS_IGNORE_REPO; check the variable and the App installation"
            else
              set +e
              GH_TOKEN="$IGNORE_TOKEN" gh api "repos/${IGNORE_REPO}/contents/${path}" \
                -H "Accept: application/vnd.github.raw" \
                > /tmp/central.gitleaksignore 2>/tmp/central.err
              code=$?
              set -e
              if [ "$code" -eq 0 ]; then
                cat /tmp/central.gitleaksignore >> /tmp/gitleaks-ignores/.gitleaksignore
                # Guarantee a separator: a central file with no trailing newline
                # would otherwise glue its last entry to the first local one,
                # silently voiding both fingerprints.
                printf '\n' >> /tmp/gitleaks-ignores/.gitleaksignore
                echo "Central ignore list: $(grep -c '^[0-9a-f]' /tmp/central.gitleaksignore || true) entries."
              elif grep -q "Not Found" /tmp/central.err; then
                echo "Central ignore list: none for ${GITHUB_REPOSITORY} (404); continuing."
              else
                fail_or_warn "Ignore list fetch failed" "could not read ${path} from the configured ignore-list repo"
              fi
            fi
          else
            echo "Central ignore list: skipped (no token; fork PR, unset GITLEAKS_IGNORE_REPO, or App secrets unavailable)."
          fi
          if [ -f .gitleaksignore ]; then
            cat .gitleaksignore >> /tmp/gitleaks-ignores/.gitleaksignore
            printf '\n' >> /tmp/gitleaks-ignores/.gitleaksignore
            echo "Added in-repo .gitleaksignore."
          fi

      - name: Scan full history for credentials
        env:
          SECRET_SCAN_SLACK_BOT_TOKEN: ${{ secrets.SECRET_SCAN_SLACK_BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set +e
          gitleaks git --redact --verbose --exit-code 2 --gitleaks-ignore-path /tmp/gitleaks-ignores . \
            --report-format json --report-path /tmp/credentials.json
          status=$?
          set -e
          # exit-code 2 on findings; 0 clean; 1 reserved for scanner errors
          if [ "$status" -eq 2 ]; then
            count=$(jq length /tmp/credentials.json)
            {
              echo "## Credential findings: ${count}"
              echo ""
              echo "| Rule | File | Line | Commit |"
              echo "|------|------|------|--------|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[:8]) |"' /tmp/credentials.json | head -50
              echo ""
              echo "**What to do:**"
              echo "1. **Rotate the credential now.** It is compromised the moment it was pushed, even on an unmerged branch; deleting the line does not help, git history keeps it."
              echo "2. Put the new value in a proper secret store (GitHub Actions secret, Pulumi secret config, 1Password), not in code."
              echo "3. False positive, or historical and already rotated? Add the finding's fingerprint to \`.gitleaksignore\`."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$ENFORCE_CREDENTIALS" = "true" ]; then
              echo "::error title=Credentials found::${count} credential finding(s) in history. Rotate and add to .gitleaksignore."
              exit 1
            fi
            echo "::warning title=Credentials found (not yet enforced)::${count} credential finding(s) in history. Rotate now; this check becomes blocking soon."
            # Red, non-required check for visibility. Read-only token (fork PRs)
            # cannot create check runs; ignore the failure there.
            GH_TOKEN="${{ github.token }}" gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="credential-findings" \
              -f head_sha="${{ github.event.pull_request.head.sha || github.sha }}" \
              -f status=completed -f conclusion=failure \
              -f 'output[title]'="${count} credential finding(s) in git history" \
              -f 'output[summary]'="Rotate the credential(s) NOW (pushed = compromised; deleting the line does not help). Details and remediation steps: see the step summary of the Secret scan workflow run. This check is informational and does not block merging." \
              || echo "could not create check run (read-only token?)"
            # Slack dedup: on PRs, notify only when the PR's own
            # commits contain findings. Historical findings alerted when they
            # were introduced and stay visible in the check run + step summary;
            # re-posting them on every push drowned the channel.
            # Anchor on the current base tip, not event base.sha: base.sha is
            # frozen at PR creation, so after a merge-from-main the stale range
            # would re-attribute main's findings to this PR. gitleaks exits 0 on
            # an unresolvable range, so validate it here and fall back to
            # full-history alerting (fail closed) on any doubt.
            notify=/tmp/credentials.json
            scope="in git history"
            # A push event carries its own range in github.event.before, which
            # covers commits landing outside a PR: the branch ruleset grants
            # PR-bypass to org admins, some repo roles, and integrations.
            range_base=""
            suppress_full_history=""
            range_head=""
            label=""
            if [ -n "$PR_HEAD_SHA" ]; then
              range_base=$(git merge-base "origin/${GITHUB_BASE_REF}" "$PR_HEAD_SHA" 2>/dev/null || true)
              range_head="$PR_HEAD_SHA"
              label="new in this PR"
            elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              # An all-zero before means branch/tag creation, which has no range.
              # Verify reachability too: a force-push can strand the old tip.
              if git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null; then
                range_base="$PUSH_BEFORE"
                range_head="$GITHUB_SHA"
                label="new in this push"
              fi
            fi
            # A rangeless push (new tag, or a force-push that stranded `before`)
            # must NOT fall through to full-history alerting: that would re-post
            # a repo's entire backlog on every release. Only an explicit manual
            # run asks for the full-history announcement.
            if [ -z "$range_base" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              suppress_full_history=1
            fi
            if [ -n "$range_base" ] && [ -n "$range_head" ] && [ -n "$SECRET_SCAN_SLACK_BOT_TOKEN" ]; then
              set +e
              gitleaks git --redact --exit-code 2 --gitleaks-ignore-path /tmp/gitleaks-ignores . \
                --log-opts "${range_base}..${range_head}" \
                --report-format json --report-path /tmp/credentials-new.json
              inc_status=$?
              set -e
              if { [ "$inc_status" -eq 0 ] || [ "$inc_status" -eq 2 ]; } && [ -s /tmp/credentials-new.json ]; then
                notify=/tmp/credentials-new.json
                scope="${label}, ${count} total in history"
              fi
            fi
            notify_count=$(jq length "$notify" 2>/dev/null || echo 0)
            if [ -n "$suppress_full_history" ]; then notify_count=0; fi
            notify_count=${notify_count:-0}
            if [ -n "$SECRET_SCAN_SLACK_BOT_TOKEN" ] && [ "$notify_count" -gt 0 ]; then
              # Escape Slack mrkdwn entities: a crafted file name could otherwise
              # render as a disguised clickable link in the alert channel.
              sample=$(jq -r 'def esc: tostring | gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
                .[:5][] | "> \(.RuleID|esc)  \(.File|esc):\(.StartLine)"' "$notify")
              txt=":rotating_light: *Credential leak detected* in \`${GITHUB_REPOSITORY}\` (${notify_count} ${scope}). Rotate immediately.
          ${sample}
          ${PR_URL:+PR: ${PR_URL}
          }Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              curl -sf -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SECRET_SCAN_SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json; charset=utf-8" \
                -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg txt "$txt" \
                  '{channel: $ch, text: $txt}')" | jq -r '.ok // "post failed"'
            else
              echo "Slack: skipped (no token or nothing new to report; notify_count=${notify_count})"
            fi
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  internal-refs:
    name: Internal references (warn-only)
    runs-on: ubuntu-latest
    env:
      HAVE_IGNORE_APP: ${{ secrets.SECRET_SCAN_APP_ID != '' }}
    # Per-repo opt-out: set the repo Actions variable
    # SECRET_SCAN_SKIP_INTERNAL_REFS=true to skip this job.
    if: ${{ vars.SECRET_SCAN_SKIP_INTERNAL_REFS != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Resolve ignore-list repo
        id: ignore-repo
        if: ${{ vars.GITLEAKS_IGNORE_REPO != '' }}
        env:
          IGNORE_REPO: ${{ vars.GITLEAKS_IGNORE_REPO }}
        run: |
          # create-github-app-token throws when a repositories entry carries an
          # owner that differs from the resolved `owner` input, so the config
          # repo's owner must be passed explicitly. It is frequently a different
          # org than the repo being scanned.
          echo "owner=${IGNORE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${IGNORE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint token for the ignore-list repo
        id: ignore-auth
        # Fork PRs and callers that do not pass `secrets: inherit` have no App
        # credentials, so skip rather than fail the job; the scan then runs with
        # local ignores only, which errs toward reporting more, not less.
        if: ${{ vars.GITLEAKS_IGNORE_REPO != '' && env.HAVE_IGNORE_APP == 'true' && github.event.pull_request.head.repo.fork != true }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SECRET_SCAN_APP_ID }}
          private-key: ${{ secrets.SECRET_SCAN_APP_PRIVATE_KEY }}
          owner: ${{ steps.ignore-repo.outputs.owner }}
          repositories: ${{ steps.ignore-repo.outputs.name }}

      - name: Assemble gitleaks ignore list
        env:
          IGNORE_REPO: ${{ vars.GITLEAKS_IGNORE_REPO }}
          IGNORE_TOKEN: ${{ steps.ignore-auth.outputs.token }}
        run: |
          # Central entries plus any in-repo .gitleaksignore. Concatenating
          # matters because --gitleaks-ignore-path REPLACES the default lookup,
          # so pointing it elsewhere would silently disable a local file.
          mkdir -p /tmp/gitleaks-ignores
          : > /tmp/gitleaks-ignores/.gitleaksignore
          # A misconfiguration must be visible but must not turn the warn-only
          # check red fleet-wide; it only fails the job once findings block.
          fail_or_warn() {
            echo "::error title=$1::$2"
            if [ "$ENFORCE_CREDENTIALS" = "true" ]; then exit 1; fi
            echo "Continuing with local ignores only (warn-only rollout)."
          }
          if [ -n "$IGNORE_TOKEN" ]; then
            path="ignores/${GITHUB_REPOSITORY}.gitleaksignore"
            # Probe the repo first. The contents API answers 404 both for "no
            # ignore file for this repo" (fine) and for "repo missing or the App
            # cannot see it" (a misconfiguration GitHub deliberately hides as
            # 404), so the two are indistinguishable from the file call alone.
            # The repo name is deliberately not echoed: on a public repo these
            # logs are public and vars are not masked.
            if ! GH_TOKEN="$IGNORE_TOKEN" gh api "repos/${IGNORE_REPO}" --silent 2>/dev/null; then
              fail_or_warn "Ignore-list repo unreachable" "cannot read the repo named by GITLEAKS_IGNORE_REPO; check the variable and the App installation"
            else
              set +e
              GH_TOKEN="$IGNORE_TOKEN" gh api "repos/${IGNORE_REPO}/contents/${path}" \
                -H "Accept: application/vnd.github.raw" \
                > /tmp/central.gitleaksignore 2>/tmp/central.err
              code=$?
              set -e
              if [ "$code" -eq 0 ]; then
                cat /tmp/central.gitleaksignore >> /tmp/gitleaks-ignores/.gitleaksignore
                # Guarantee a separator: a central file with no trailing newline
                # would otherwise glue its last entry to the first local one,
                # silently voiding both fingerprints.
                printf '\n' >> /tmp/gitleaks-ignores/.gitleaksignore
                echo "Central ignore list: $(grep -c '^[0-9a-f]' /tmp/central.gitleaksignore || true) entries."
              elif grep -q "Not Found" /tmp/central.err; then
                echo "Central ignore list: none for ${GITHUB_REPOSITORY} (404); continuing."
              else
                fail_or_warn "Ignore list fetch failed" "could not read ${path} from the configured ignore-list repo"
              fi
            fi
          else
            echo "Central ignore list: skipped (no token; fork PR, unset GITLEAKS_IGNORE_REPO, or App secrets unavailable)."
          fi
          if [ -f .gitleaksignore ]; then
            cat .gitleaksignore >> /tmp/gitleaks-ignores/.gitleaksignore
            printf '\n' >> /tmp/gitleaks-ignores/.gitleaksignore
            echo "Added in-repo .gitleaksignore."
          fi

      - name: Scan full history for internal references
        if: ${{ steps.config.outputs.skip != 'true' }}
        env:
          SECRET_SCAN_SLACK_BOT_TOKEN: ${{ secrets.SECRET_SCAN_SLACK_BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set +e
          gitleaks git --config /tmp/gitleaks-internal.toml --verbose --exit-code 2 --gitleaks-ignore-path /tmp/gitleaks-ignores . \
            --report-format json --report-path /tmp/internal-refs.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            count=$(jq length /tmp/internal-refs.json)
            # Severity depends on visibility: on a public repo these are ALREADY
            # disclosed, so the private-repo phrasing would tell readers to relax
            # about a live exposure.
            # Actions coerces null to 0 and false to 0, so `private == false`
            # is also true when the payload has no repository. Test the raw
            # value instead and default an absent one to the louder message.
            if [ "$REPO_IS_PRIVATE" != "true" ]; then
              headline="${count} internal Astera reference(s) are PUBLICLY VISIBLE in this repo's history."
              guidance="These are already disclosed. Remove them from the working tree now, and treat anything reachable (hosts, URLs, credentials) as exposed. Accepted findings belong in the ignore list with a stated reason."
            else
              headline="${count} internal Astera reference(s) in history."
              guidance="Fine while this repo is private; MUST be resolved before it is made public."
            fi
            echo "::warning title=Internal references found::${headline} ${guidance}"
            {
              echo "## Internal references (warn-only): ${count} finding(s)"
              echo ""
              echo "| Rule | File | Line |"
              echo "|------|------|------|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) |"' /tmp/internal-refs.json | head -50
              echo ""
              echo "**What to do:** ${guidance}"
              echo ""
              echo "Note git history keeps old occurrences, so removing them from the working tree does not clear this check; a repo that must be scrubbed should be republished as a fresh single-commit repo. Deliberately accepted references go in the ignore list."
            } >> "$GITHUB_STEP_SUMMARY"
            GH_TOKEN="${{ github.token }}" gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="internal-ref-findings" \
              -f head_sha="${{ github.event.pull_request.head.sha || github.sha }}" \
              -f status=completed -f conclusion=failure \
              -f 'output[title]'="${count} internal Astera reference(s) in git history" \
              -f 'output[summary]'="${guidance} Details: see the step summary of the Secret scan workflow run. This check is informational and does not block merging." \
              || echo "could not create check run (read-only token?)"
            # Slack dedup: same rule as the credentials job: on PRs,
            # notify only for findings introduced by the PR's own commits.
            # Anchor on the current base tip, not event base.sha: base.sha is
            # frozen at PR creation, so after a merge-from-main the stale range
            # would re-attribute main's findings to this PR. gitleaks exits 0 on
            # an unresolvable range, so validate it here and fall back to
            # full-history alerting (fail closed) on any doubt.
            notify=/tmp/internal-refs.json
            scope="in git history"
            # A push event carries its own range in github.event.before, which
            # covers commits landing outside a PR: the branch ruleset grants
            # PR-bypass to org admins, some repo roles, and integrations.
            range_base=""
            suppress_full_history=""
            range_head=""
            label=""
            if [ -n "$PR_HEAD_SHA" ]; then
              range_base=$(git merge-base "origin/${GITHUB_BASE_REF}" "$PR_HEAD_SHA" 2>/dev/null || true)
              range_head="$PR_HEAD_SHA"
              label="new in this PR"
            elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              # An all-zero before means branch/tag creation, which has no range.
              # Verify reachability too: a force-push can strand the old tip.
              if git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null; then
                range_base="$PUSH_BEFORE"
                range_head="$GITHUB_SHA"
                label="new in this push"
              fi
            fi
            # A rangeless push (new tag, or a force-push that stranded `before`)
            # must NOT fall through to full-history alerting: that would re-post
            # a repo's entire backlog on every release. Only an explicit manual
            # run asks for the full-history announcement.
            if [ -z "$range_base" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              suppress_full_history=1
            fi
            if [ -n "$range_base" ] && [ -n "$range_head" ] && [ -n "$SECRET_SCAN_SLACK_BOT_TOKEN" ]; then
              set +e
              gitleaks git --config /tmp/gitleaks-internal.toml --exit-code 2 --gitleaks-ignore-path /tmp/gitleaks-ignores . \
                --log-opts "${range_base}..${range_head}" \
                --report-format json --report-path /tmp/internal-refs-new.json
              inc_status=$?
              set -e
              if { [ "$inc_status" -eq 0 ] || [ "$inc_status" -eq 2 ]; } && [ -s /tmp/internal-refs-new.json ]; then
                notify=/tmp/internal-refs-new.json
                scope="${label}, ${count} total in history"
              fi
            fi
            notify_count=$(jq length "$notify" 2>/dev/null || echo 0)
            if [ -n "$suppress_full_history" ]; then notify_count=0; fi
            notify_count=${notify_count:-0}
            if [ -n "$SECRET_SCAN_SLACK_BOT_TOKEN" ] && [ "$notify_count" -gt 0 ]; then
              # Escape Slack mrkdwn entities: a crafted file name could otherwise
              # render as a disguised clickable link in the alert channel.
              sample=$(jq -r 'def esc: tostring | gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
                .[:5][] | "> \(.RuleID|esc)  \(.File|esc):\(.StartLine)"' "$notify")
              txt=":warning: Internal Astera references in \`${GITHUB_REPOSITORY}\` (${notify_count} ${scope}). ${guidance}
          ${sample}
          ${PR_URL:+PR: ${PR_URL}
          }Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              curl -sf -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SECRET_SCAN_SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json; charset=utf-8" \
                -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg txt "$txt" \
                  '{channel: $ch, text: $txt}')" | jq -r '.ok // "post failed"'
            else
              echo "Slack: skipped (no token or nothing new to report; notify_count=${notify_count})"
            fi
          elif [ "$status" -ne 0 ]; then
            echo "gitleaks failed with status $status" >&2
            exit "$status"
          fi
